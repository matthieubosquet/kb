services:
  triple-store:
    build:
      context: ./store
      dockerfile: Dockerfile
      args:
        GRAPH_BASE: https://ns.example.org/
        # Named graphs left out of inference and of the default graph (an entry also covers the graphs under it)
        INFERENCE_EXCLUDE: owl rdf rdfs xsd shacl
        # Full-text search (text:query) with a Lucene index: true or false
        FULL_TEXT: "true"
      additional_contexts:
        config: ./store
        data: ./data
        ontology: ./ontology
        shapes: ./shapes
    image: triple-store-container
    ports:
      - "3030:3030"
      - "8080:8080"

  named-query:
    build:
      context: ./query
      dockerfile: Dockerfile
    image: named-query-container
    network_mode: service:triple-store
    environment:
      NamedQuery__SparqlEndpoint: http://localhost:3030/
    depends_on:
      - triple-store

  redirect:
    build:
      context: ./redirect
      dockerfile: Dockerfile
    image: redirect-container
    ports:
      - "4040:4040"
